[project]
name = "gaming-analytics-ai-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"

# dependencies
dependencies = [
    "chromadb>=1.0.4",
    "openai>=1.73.0",
    "pydantic>=2.11.3",
    "python-dotenv>=1.1.0",
    "tavily-python>=0.5.4",
    "pysqlite3",
    "arize-phoenix>=20.11.0",
    "arize-phoenix-otel>=0.17.1",
    "openinference-instrumentation-openai>=0.1.60",
    "openinference-instrumentation>=0.1.63",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
